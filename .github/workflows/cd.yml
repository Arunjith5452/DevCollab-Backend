name: CD

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: arunjith5452/devcollab-backend:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 1. Pull the latest image you pushed to Docker Hub
            sudo docker pull arunjith5452/devcollab-backend:latest

            # 2. Stop and remove the old version
            sudo docker stop devcollab-backend || true
            sudo docker rm devcollab-backend || true

            # 3. Start the container using your server's .env file
            sudo docker run -d \
              --name devcollab-backend \
              -p 3001:3001 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/.env \
              --restart always \
              arunjith5452/devcollab-backend:latest