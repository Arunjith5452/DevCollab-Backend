name: CD

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  deploy-to-ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 1. Pull the latest image you pushed to Docker Hub
            sudo docker pull arunjith5452/devcollab-backend:latest

            # 2. Stop and remove the old version
            sudo docker stop devcollab-backend || true
            sudo docker rm devcollab-backend || true

            # 3. Start the container using your server's .env file
            sudo docker run -d \
              --name devcollab-backend \
              -p 3001:3001 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/.env \
              --restart always \
              arunjith5452/devcollab-backend:latest